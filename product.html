<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Indiemode SA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=DM+Serif+Display:ital@0;1&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F172A;--surface:#1E293B;--primary:#FF006E;--secondary:#00F5D4;--text:#F8FAFC;--border:rgba(248,250,252,0.08);--border-hi:rgba(248,250,252,0.16);--muted:rgba(248,250,252,0.45);--dim:rgba(248,250,252,0.2);--primary-glow:rgba(255,0,110,0.25);--teal-glow:rgba(0,245,212,0.18);--condensed:'Barlow Condensed',sans-serif;--serif:'DM Serif Display',Georgia,serif;--body:'Barlow',sans-serif;--rule:1px solid rgba(248,250,252,0.1);--nav-h:64px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;background-image:linear-gradient(rgba(248,250,252,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(248,250,252,.018) 1px,transparent 1px);background-size:60px 60px}
a{text-decoration:none;color:inherit}button{cursor:pointer;border:none;background:none;font-family:var(--body)}img{display:block;max-width:100%}
/* NAV */
.s-overlay{position:fixed;inset:0;background:rgba(15,23,42,.96);z-index:300;display:flex;align-items:flex-start;padding-top:120px;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(8px)}
.s-overlay.open{opacity:1;pointer-events:all}
.s-wrap{width:100%;max-width:680px;padding:0 40px}
.s-label{font-family:var(--condensed);font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--secondary);margin-bottom:20px}
.s-input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(248,250,252,.2);font-family:var(--serif);font-size:40px;font-style:italic;color:var(--text);padding:12px 0;outline:none}
.s-input::placeholder{color:var(--dim)}
.s-close{position:absolute;top:32px;right:40px;font-family:var(--condensed);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;background:rgba(15,23,42,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 40px;height:100%;display:flex;align-items:center}
.nav-logo{font-family:var(--condensed);font-size:20px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--text);margin-right:48px;flex-shrink:0;position:relative}
.nav-logo .logo-accent{color:var(--primary);font-style:italic;font-family:var(--serif);font-size:22px;letter-spacing:0;font-weight:400}
.nav-logo::after{content:'EST. ZA — 2012';position:absolute;bottom:-9px;left:0;font-size:7px;letter-spacing:.22em;color:var(--dim);white-space:nowrap;font-family:var(--condensed);font-weight:700;text-transform:uppercase}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none;flex:1}
.nav-links a{font-family:var(--condensed);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:color .2s;position:relative}
.nav-links a:hover{color:var(--text)}.nav-links a.nav-sale{color:var(--primary)}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:var(--secondary);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.nav-links a:hover::after{transform:scaleX(1)}
.nav-right{display:flex;align-items:center;gap:16px;margin-left:auto}
.nav-search-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:4px;color:var(--muted);border:1px solid transparent;transition:color .2s,border-color .2s}
.nav-search-btn:hover{color:var(--text);border-color:var(--border-hi)}
.nav-cart{display:flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid var(--primary);color:var(--primary);font-family:var(--condensed);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;border-radius:2px;transition:background .2s,color .2s,box-shadow .2s}
.nav-cart:hover{background:var(--primary);color:var(--bg);box-shadow:0 0 20px var(--primary-glow)}
.cart-count{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--primary);color:var(--bg);font-size:9px;font-weight:900;border-radius:50%}
/* BREADCRUMB */
.breadcrumb{padding:calc(var(--nav-h) + 20px) 0 0;max-width:1280px;margin:0 auto;padding-left:40px;padding-right:40px}
.breadcrumb-inner{display:flex;align-items:center;gap:8px;font-family:var(--condensed);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.breadcrumb a{color:var(--dim);transition:color .2s}.breadcrumb a:hover{color:var(--secondary)}
.breadcrumb-sep{color:var(--border-hi)}
.breadcrumb-cur{color:var(--secondary)}
/* PRODUCT HERO */
.pd-wrap{max-width:1280px;margin:0 auto;padding:24px 40px 80px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
/* GALLERY */
.pd-gallery{position:sticky;top:calc(var(--nav-h) + 24px);display:flex;flex-direction:column;gap:10px}
.pd-main-img{aspect-ratio:3/4;overflow:hidden;position:relative;background:var(--surface);border:1px solid var(--border);border-radius:2px;cursor:zoom-in}
.pd-main-img img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .5s ease}
.pd-main-img:hover img{transform:scale(1.04)}
.pd-badge-wrap{position:absolute;top:16px;left:16px;z-index:2}
.pd-badge{font-family:var(--condensed);font-size:8px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;padding:4px 10px;border-radius:1px}
.bdg-new{background:var(--surface);color:var(--secondary);border:1px solid var(--secondary)}
.bdg-sale{background:var(--primary);color:var(--bg)}
.bdg-ltd{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.pd-thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pd-thumbs::-webkit-scrollbar{display:none}
.pd-thumb{width:72px;height:96px;flex-shrink:0;overflow:hidden;border:1px solid var(--border);border-radius:1px;cursor:pointer;transition:border-color .2s;opacity:.55;transition:opacity .2s,border-color .2s}
.pd-thumb:hover,.pd-thumb.active{opacity:1;border-color:var(--secondary)}
.pd-thumb img{width:100%;height:100%;object-fit:cover;object-position:center top}
/* INFO PANEL */
.pd-info{padding-top:8px}
.pd-spec{font-family:var(--condensed);font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--secondary);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.pd-spec::before{content:'';width:20px;height:1px;background:var(--secondary)}
.pd-brand-link{font-family:var(--condensed);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:inline-flex;align-items:center;gap:6px;transition:color .2s}
.pd-brand-link:hover{color:var(--secondary)}
.pd-name{font-family:var(--serif);font-size:clamp(32px,4vw,52px);font-weight:400;line-height:1.02;color:var(--text);margin-bottom:8px}
.pd-stars-row{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.pd-stars{font-size:13px;color:var(--secondary)}
.pd-rev-count{font-family:var(--condensed);font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.pd-price{font-family:var(--condensed);font-size:32px;font-weight:900;color:var(--text);margin-bottom:24px;display:flex;align-items:baseline;gap:10px}
.pd-orig{font-size:18px;color:var(--dim);text-decoration:line-through;font-weight:400}
.pd-rule{width:100%;height:1px;background:var(--border);margin-bottom:24px}
.pd-desc{font-size:15px;font-weight:300;line-height:1.85;color:var(--muted);margin-bottom:28px}
/* ATTRS */
.pd-attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:28px}
.pd-attr-item{padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:2px}
.pd-attr-key{font-family:var(--condensed);font-size:8px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pd-attr-val{font-family:var(--condensed);font-size:12px;font-weight:700;color:var(--text);letter-spacing:.04em}
/* SIZES */
.pd-sizes{margin-bottom:28px}
.pd-sizes-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pd-sizes-label{font-family:var(--condensed);font-size:9px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:var(--secondary)}
.pd-size-guide{font-family:var(--condensed);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--dim);padding-bottom:1px;cursor:pointer;transition:color .2s}
.pd-size-guide:hover{color:var(--secondary);border-bottom-color:var(--secondary)}
.pd-size-grid{display:flex;gap:8px;flex-wrap:wrap}
.size-btn{min-width:48px;height:48px;padding:0 12px;border:1px solid var(--border-hi);color:var(--muted);font-family:var(--condensed);font-size:12px;font-weight:700;border-radius:2px;transition:border-color .2s,color .2s,background .2s;cursor:pointer;background:none}
.size-btn:hover,.size-btn.active{border-color:var(--secondary);color:var(--secondary);background:rgba(0,245,212,.06)}
.size-btn.sold{opacity:.3;cursor:not-allowed;text-decoration:line-through}
/* CTAS */
.pd-ctas{display:flex;gap:10px;margin-bottom:24px}
.btn-atb{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;background:var(--primary);color:var(--bg);font-family:var(--condensed);font-size:13px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;border:none;border-radius:2px;transition:box-shadow .2s,transform .15s;cursor:pointer;flex:1}
.btn-atb:hover{box-shadow:0 0 32px var(--primary-glow);transform:translateY(-1px)}
.btn-wish{width:52px;height:52px;border:1px solid var(--border-hi);color:var(--muted);font-size:20px;border-radius:2px;cursor:pointer;background:none;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,background .2s}
.btn-wish:hover,.btn-wish.wished{border-color:var(--primary);color:var(--primary);background:rgba(255,0,110,.06)}
/* TRUST PILLS */
.pd-trust{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.trust-pill{display:flex;align-items:center;gap:6px;font-family:var(--condensed);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:6px 12px;border:1px solid var(--border);border-radius:1px}
.trust-pill-icon{color:var(--secondary);font-size:11px}
/* DESIGNER PANEL */
.pd-designer{margin-top:28px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;gap:16px}
.pd-designer-img{width:56px;height:56px;overflow:hidden;border-radius:1px;flex-shrink:0;border:1px solid var(--border)}
.pd-designer-img img{width:100%;height:100%;object-fit:cover;object-position:center top}
.pd-designer-label{font-family:var(--condensed);font-size:8px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pd-designer-name{font-family:var(--serif);font-size:18px;color:var(--text);margin-bottom:3px}
.pd-designer-loc{font-family:var(--condensed);font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--secondary)}
.pd-designer-link{margin-left:auto;font-family:var(--condensed);font-size:9px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--secondary);display:flex;align-items:center;gap:5px;flex-shrink:0;border-bottom:1px solid transparent;padding-bottom:1px;transition:border-color .2s}
.pd-designer-link:hover{border-bottom-color:var(--secondary)}
/* RELATED */
.related{padding:64px 0 80px;border-top:var(--rule)}
.related-inner{max-width:1280px;margin:0 auto;padding:0 40px}
.related-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;padding-bottom:20px;border-bottom:var(--rule)}
.related-label{font-family:var(--condensed);font-size:9px;font-weight:900;letter-spacing:.32em;text-transform:uppercase;color:var(--secondary);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.related-label::before{content:'';width:20px;height:1px;background:var(--secondary)}
.related-title{font-family:var(--serif);font-size:clamp(24px,3vw,38px);font-weight:400;color:var(--text)}
.related-title em{font-style:italic;color:var(--primary)}
.see-all{font-family:var(--condensed);font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--secondary);display:flex;align-items:center;gap:6px;border-bottom:1px solid transparent;padding-bottom:1px;transition:border-color .2s}
.see-all:hover{border-bottom-color:var(--secondary)}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:2px;overflow:hidden}
/* PRODUCT CARD */
.prod-card{background:var(--bg);position:relative;transition:background .2s;display:block}
.prod-card:hover{background:var(--surface)}
.prod-card:hover .prod-img img{transform:scale(1.04)}
.prod-img{aspect-ratio:3/4;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.prod-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .5s ease}
.prod-quick{position:absolute;bottom:0;left:0;right:0;padding:12px;background:var(--primary);font-family:var(--condensed);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--bg);text-align:center;transform:translateY(100%);transition:transform .2s;z-index:2}
.prod-card:hover .prod-quick{transform:translateY(0)}
.prod-badge{position:absolute;top:12px;left:12px;font-family:var(--condensed);font-size:8px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;padding:3px 8px;border-radius:1px;z-index:2}
.prod-info{padding:14px 16px}
.prod-brand{font-family:var(--condensed);font-size:8px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:var(--secondary);margin-bottom:5px}
.prod-name{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--text);line-height:1.2;margin-bottom:10px}
.prod-foot{display:flex;align-items:center;justify-content:space-between}
.prod-price{font-family:var(--condensed);font-size:16px;font-weight:900;color:var(--text)}
.prod-orig{font-size:12px;color:var(--dim);text-decoration:line-through;margin-right:6px;font-weight:400}
.prod-stars{font-family:var(--condensed);font-size:11px;color:var(--secondary)}
/* FOOTER */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:translateY(0)}
.footer{background:var(--surface);border-top:2px solid var(--border);padding:60px 0 36px}
.footer-inner{max-width:1280px;margin:0 auto;padding:0 40px}
.footer-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:60px;padding-bottom:48px;border-bottom:var(--rule)}
.footer-logo{font-family:var(--condensed);font-size:22px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--text);margin-bottom:6px}
.footer-logo .lo-accent{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px;letter-spacing:0;color:var(--primary)}
.footer-spec{font-family:var(--condensed);font-size:8px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-bottom:20px}
.footer-tagline{font-size:14px;font-weight:300;line-height:1.7;color:var(--muted);max-width:260px;margin-bottom:28px}
.footer-socials{display:flex;gap:8px}
.soc-btn{width:32px;height:32px;border-radius:1px;border:1px solid var(--border-hi);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;transition:border-color .2s,color .2s,background .2s}
.soc-btn:hover{border-color:var(--primary);color:var(--primary);background:rgba(255,0,110,.08)}
.footer-col-title{font-family:var(--condensed);font-size:9px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:var(--secondary);margin-bottom:18px}
.footer-links{list-style:none;display:flex;flex-direction:column;gap:10px}
.footer-links a{font-family:var(--condensed);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);transition:color .2s}
.footer-links a:hover{color:var(--text)}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:28px;flex-wrap:wrap}
.footer-copy{font-family:var(--condensed);font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
@media(max-width:900px){.pd-wrap{grid-template-columns:1fr;gap:32px}.pd-gallery{position:static}.related-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){:root{--nav-h:58px}.breadcrumb{padding-left:24px;padding-right:24px}.pd-wrap{padding:20px 24px 60px}.pd-attrs{grid-template-columns:1fr}.related-inner{padding:0 24px}.footer-top{grid-template-columns:1fr 1fr;gap:32px}.nav-links{display:none}}
.nav-wish-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:4px;color:var(--muted);border:1px solid transparent;transition:color .2s,border-color .2s;position:r<div class="nav-right">
      <button class="nav-search-btn" onclick="openSearch()" aria-label="Search">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M13 13L16 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="nav-wish-btn" onclick="Cart.openWishDrawer()" aria-label="Wishlist">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13.5S1.5 9.5 1.5 5.5A3.5 3.5 0 0 1 8 3.757 3.5 3.5 0 0 1 14.5 5.5C14.5 9.5 8 13.5 8 13.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span class="wish-count" id="wishCount">0</span>
      </button>
      <button class="nav-cart" onclick="Cart.openDrawer()" aria-label="Open bag">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M1 1H3L4.5 9.5H12.5L14 4H4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="12.5" r="1" fill="currentColor"/><circle cx="11" cy="12.5" r="1" fill="currentColor"/></svg>
        Bag <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>ke-width="1.4"/><path d="M13 13L16 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <a href="shop.html" class="nav-cart"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M1 1H3L4.5 9.5H12.5L14 4H4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="12.5" r="1" fill="currentColor"/><circle cx="11" cy="12.5" r="1" fill="currentColor"/></svg>Bag <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</nav>

<div class="s-overlay" id="sOverlay">
  <button class="s-close" onclick="closeSearch()">ESC — CLOSE</button>
  <div class="s-wrap"><div class="s-label">Search specimen catalogue</div><input class="s-input" type="text" placeholder="designer, garment, collection…" id="sInput" autocomplete="off"></div>
</div>

<div class="breadcrumb">
  <div class="breadcrumb-inner" id="breadcrumb">
    <a href="index.html">Home</a>
    <span class="breadcrumb-sep">·</span>
    <a href="shop.html">Shop</a>
    <span class="breadcrumb-sep">·</span>
    <span class="breadcrumb-cur" id="breadcrumb-cat">Loading</span>
    <span class="breadcrumb-sep">·</span>
    <span class="breadcrumb-cur" id="breadcrumb-name">Loading</span>
  </div>
</div>

<div class="pd-wrap">
  <!-- GALLERY -->
  <div class="pd-gallery">
    <div class="pd-main-img" id="pdMainImg">
      <img src="img/prod-01.jpg" alt="Product" loading="eager" id="pdMainImgEl">
      <div class="pd-badge-wrap" id="pdBadgeWrap"></div>
    </div>
    <div class="pd-thumbs" id="pdThumbs"></div>
  </div>

  <!-- INFO -->
  <div class="pd-info">
    <div class="pd-spec" id="pdSpec">Specimen — SS 2026</div>

      <div class="pd-stars">★★★★★</div>

    </div>
    <div class="pd-price" id="pdPrice">—</div>

    <div class="pd-attrs" id="pdAttrs"></div>

    <div class="pd-sizes">

        <div class="pd-sizes-label">Select size</div>

      </div>

    <div class="pd-ctas">
      <button class="btn-atb" id="pdAtbBtn" onclick="addToCart()">Add to Bag →</button>
      <button class="btn-wish wish-btn" id="pdWishBtn" aria-label="Add to wishlist">♡</button>

    <div class="pd-trust">
      <div class="trust-pill"><span class="trust-pill-icon">◎</span>Free delivery over R800</div>

    <div class="pd-designer" id="pdDesigner">

        <div class="pd-designer-label">Designed by</div>

      </div>
      <a href="#" class="pd-designer-link" id="pdDesignerLink">Full collection →</a>

<script src="data.js"></script><script src="app.js"></script>
<script src="cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const id = new URLSearchParams(location.search).get('id') || IM.products[0].id;
  const p  = IM.products.find(x => x.id === id) || IM.products[0];
  const brand = IM.brands.find(b => b.id === p.brand) || {};
  const imgSrc = IM.images[p.img] || 'img/prod-01.jpg';
  const reviews = Math.floor(Math.random() * 60) + 8;

  // Breadcrumb
  document.getElementById('breadcrumb-cat').textContent = (p.category||'').replace(/^\w/,c=>c.toUpperCase());
  document.getElementById('breadcrumb-name').textContent = p.name;

  // Spec
  document.getElementById('pdSpec').textContent = `Specimen — ${p.category ? p.category.toUpperCase() : 'SS 2026'}`;

  // Brand link
  const bl = document.getElementById('pdBrandLink');
  bl.textContent = brand.name || p.brand;
  bl.href = `designer.html?id=${p.brand}`;

  // Name & page title
  document.getElementById('pdName').textContent = p.name;
  document.title = `${p.name} — Indiemode SA`;

  // Reviews
  document.getElementById('pdRevCount').textContent = `(${reviews} reviews)`;

  // Price
  const priceEl = document.getElementById('pdPrice');
  priceEl.innerHTML = p.originalPrice
    ? `<span class="pd-orig">R ${p.originalPrice.toLocaleString()}</span>R ${p.price.toLocaleString()}`
    : `R ${p.price.toLocaleString()}`;

  // Description
  document.getElementById('pdDesc').textContent = p.description || '';

  // Attrs
  const attrs = [['Material',p.material],['Origin',p.origin],['Run',p.run],['Care',p.care]].filter(([,v])=>v);
  document.getElementById('pdAttrs').innerHTML = attrs.map(([k,v])=>`
    <div class="pd-attr-item"><div class="pd-attr-key">${k}</div><div class="pd-attr-val">${v}</div></div>`).join('');

  // Sizes
  const sg = document.getElementById('pdSizes');
  if (p.sizes && p.sizes.length) {
    sg.innerHTML = p.sizes.map(s => {
      const sold = p.soldOut && p.soldOut.includes(s);
      return `<button class="size-btn${sold?' sold':''}" onclick="selectSize(this)" ${sold?'disabled':''}>${s}</button>`;
    }).join('');
    const first = sg.querySelector('.size-btn:not(.sold)');
    if (first) first.classList.add('active');
  }

  // Badge
  const bmap = {new:'bdg-new',sale:'bdg-sale',ltd:'bdg-ltd'};
  const blmap = {new:'New Specimen',sale:'On Sale',ltd:'Limited Run'};
  document.getElementById('pdBadgeWrap').innerHTML = p.badge
    ? `<span class="pd-badge ${bmap[p.badge]}">${blmap[p.badge]}</span>` : '';

  // Gallery — main + thumbnails
  const mainEl = document.getElementById('pdMainImgEl');
  mainEl.src = imgSrc; mainEl.alt = p.name;

  // Generate alt images from same category
  const catImgs = IM.products
    .filter(x => x.category === p.category && x.id !== p.id)
    .slice(0, 4)
    .map(x => IM.images[x.img])
    .filter(Boolean);
  const thumbImgs = [imgSrc, ...catImgs].slice(0, 5);

  const thumbsEl = document.getElementById('pdThumbs');
  thumbsEl.innerHTML = thumbImgs.map((src, i) => `
    <div class="pd-thumb${i===0?' active':''}" onclick="switchImg('${src}',this)">
      <img src="${src}" alt="" loading="lazy">
    </div>`).join('');

  // Designer panel
  document.getElementById('pdDesignerName').textContent = brand.name || p.brand;
  document.getElementById('pdDesignerLoc').textContent = brand.city ? `${brand.city}, ${brand.province}` : '';
  document.getElementById('pdDesignerLink').href = `designer.html?id=${p.brand}`;
  const dImg = document.getElementById('pdDesignerImg').querySelector('img');
  dImg.src = IM.images[brand.img] || imgSrc;

  // Related products
  const related = IM.products
    .filter(x => x.category === p.category && x.id !== p.id)
    .slice(0, 4);
  const fallback = IM.products.filter(x => x.id !== p.id).slice(0, 4);
  const toShow = related.length >= 2 ? related : fallback;
  const badgeClass = {new:'bdg-new',sale:'bdg-sale',ltd:'bdg-ltd'};
  document.getElementById('relatedSeeAll').href = `shop.html?cat=${p.category}`;
  document.getElementById('relatedGrid').innerHTML = toShow.map(r => {
    const rb = IM.brands.find(b => b.id === r.brand) || {};
    const badge = r.badge ? `<span class="prod-badge ${badgeClass[r.badge]}">${{new:'New',sale:'Sale',ltd:'Ltd'}[r.badge]}</span>` : '';
    return `<a class="prod-card reveal" href="product.html?id=${r.id}">
      <div class="prod-img"><img src="${IM.images[r.img]||'img/prod-01.jpg'}" alt="${r.name}" loading="lazy">${badge}<div class="prod-quick">View Product →</div></div>
      <div class="prod-info">
        <div class="prod-brand">${rb.name||r.brand}</div>
        <div class="prod-name">${r.name}</div>
        <div class="prod-foot"><div class="prod-price">${r.originalPrice?`<span class="prod-orig">R ${r.originalPrice.toLocaleString()}</span>`:''}R ${r.price.toLocaleString()}</div><div class="prod-stars">★★★★★</div></div>
      </div></a>`;
  }).join('');

  // Globals
  window.switchImg = (src, thumb) => {
    mainEl.src = src;
    document.querySelectorAll('.pd-thumb').forEach(t => t.classList.remove('active'));
    thumb.classList.add('active');
  };
  window.selectSize = btn => {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };

  // Reveals
  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal').forEach((el,i) => setTimeout(()=>el.classList.add('in'),i*60));
  });
});
</script>
